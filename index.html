<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="description" content="Một bó hoa, một chiếc bánh và một câu chuyện nhỏ dành riêng cho Thanh Nhã.">
  <title>Bó Hoa Đến Trễ — Gửi Thanh Nhã</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root{--paper:#FBF8F2;--ink:#51464C;--muted:#756B72;--rose:#BD8097;--rose-text:#9D5C72;--rose-soft:#F2DAE1;--sage:#D8E4D9;--lilac:#E6E1EE;--butter:#F5E8C5;--line:rgba(81,70,76,.22);--ease:cubic-bezier(.22,.72,.2,1)}
  *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;color:var(--ink);background:var(--paper);font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-width:320px}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:15;opacity:.28;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='15' cy='16' r='.42' fill='%23b1a1a2'/%3E%3Ccircle cx='61' cy='40' r='.42' fill='%23b1a1a2'/%3E%3Ccircle cx='40' cy='76' r='.32' fill='%23b1a1a2'/%3E%3C/svg%3E");}
  button{font:inherit;cursor:pointer} button:focus-visible,a:focus-visible{outline:2px solid var(--rose-text);outline-offset:4px} button:disabled{cursor:not-allowed;opacity:.45}
  .site-header{height:90px;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(20px,4.4vw,78px);gap:20px;position:relative;z-index:20}
  .mark{text-decoration:none;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:27px;line-height:1}
  .mark small{display:block;font:500 9px/1.4 "DM Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-style:normal}
  .header-right{display:flex;align-items:center;gap:22px}.counter{font:500 12px "DM Sans",sans-serif;letter-spacing:.1em;color:var(--muted)}.counter strong{color:var(--ink);font-weight:600}
  .restart{border:0;border-bottom:1px solid var(--line);background:none;color:var(--muted);font-size:11px;padding:8px 0}
  .progress{position:absolute;bottom:0;left:clamp(20px,4.4vw,78px);right:clamp(20px,4.4vw,78px);height:1px;background:rgba(81,70,76,.11)}
  .progress-inner{height:2px;background:var(--rose);width:8.3333%;transition:width .5s var(--ease)}
  main{max-width:1510px;margin:auto;min-height:calc(100svh - 90px);display:flex;align-items:center;justify-content:center;padding:34px clamp(20px,5vw,90px) 62px}
  #app{width:100%}.scene{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(36px,7vw,118px);align-items:center;min-height:570px;animation:sceneIn .56s var(--ease) both}.scene.flip{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}.scene.flip .copy-side{order:2}.scene.flip .art-side{order:1}
  @keyframes sceneIn{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
  .copy-side{max-width:530px;justify-self:center;width:100%;z-index:2}.chapter{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-text);margin:0 0 25px}.chapter span{display:inline-block;width:28px;height:1px;background:currentColor;vertical-align:middle;margin:0 12px 3px 0}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(64px,6vw,105px);font-weight:400;letter-spacing:-.047em;line-height:.86;margin:0;max-width:7.8em;text-wrap:balance}h1 em{font-weight:400;color:var(--rose-text)}
  .sub{margin:25px 0 0;color:var(--muted);max-width:42ch;font-size:15px;line-height:1.9;min-height:42px}.message{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(20px,2vw,28px);font-style:italic;line-height:1.3;color:var(--rose-text);margin-top:24px;max-width:430px}
  .actions{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-top:35px}.main-btn{min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:13px 27px;color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:2px;font-size:12px;font-weight:600;letter-spacing:.02em;transition:background .3s,border-color .3s,transform .3s}.main-btn:hover:not(:disabled){background:var(--rose);border-color:var(--rose);transform:translateY(-2px)}.main-btn.secondary{background:none;color:var(--ink)}.main-btn.secondary:hover{color:var(--rose-text);border-color:var(--rose)}
  .text-btn{padding:13px 0;border:0;background:none;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.hint{color:var(--muted);font-size:11px;line-height:1.7;margin-top:16px}.mini-status{font-size:11px;color:var(--rose-text);letter-spacing:.06em;margin-top:18px;min-height:18px}
  .art-side{position:relative;width:100%;min-height:530px;display:grid;place-items:center;isolation:isolate;overflow:visible}.art-side:before{content:"";position:absolute;z-index:-1;width:min(100%,620px);height:94%;border-radius:48% 52% 50% 50%;background:radial-gradient(ellipse at 50% 45%,rgba(242,218,225,.44),rgba(245,232,197,.24) 50%,transparent 75%)}
  .art-side:after{content:"";position:absolute;z-index:-2;width:72%;aspect-ratio:1;border:1px solid rgba(189,128,151,.14);border-radius:50%;transform:rotate(-13deg)}
  .art-side svg{display:block;width:100%;max-width:670px;max-height:570px;overflow:visible}.art-caption{position:absolute;bottom:2px;right:12px;color:#766D74;font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;font-style:italic}
  .art-action{display:grid;place-items:center;border:0;background:transparent;color:inherit;width:min(100%,660px);padding:0;transition:transform .42s var(--ease)}.art-action:hover:not(:disabled){transform:translateY(-6px) rotate(.45deg)}.art-action svg{pointer-events:none}
  .poster{position:relative;background:rgba(255,254,251,.70);box-shadow:0 27px 68px rgba(85,62,67,.08);border:1px solid rgba(101,77,84,.15)}
  .postcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:min(100%,560px);padding:20px;align-items:center}
  .postcard{position:relative;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;aspect-ratio:.79;min-width:0;background:rgba(255,254,251,.8);border:1px solid rgba(81,70,76,.18);box-shadow:0 14px 30px rgba(96,69,75,.08);transition:transform .35s var(--ease),background .35s}.postcard:first-child{transform:rotate(-7deg)}.postcard:last-child{transform:rotate(6deg)}.postcard:hover{transform:rotate(0) translateY(-5px)}.postcard.revealed{background:#f3e8e9;border-color:rgba(189,128,151,.4)}.postcard svg{width:90%;height:70%}.postcard span{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(19px,2vw,26px);font-style:italic;color:var(--ink)}
  .garden{position:relative;width:min(100%,640px);height:490px;display:flex;align-items:flex-end;justify-content:space-around;padding:50px 0 65px}.garden:after{content:"";position:absolute;bottom:45px;left:12%;width:76%;height:1px;background:var(--line)}.garden-btn{display:grid;place-items:center;position:relative;border:0;background:none;width:30%;height:100%;align-items:end;padding:0}.garden-btn svg{width:100%;max-height:355px;transform-origin:bottom center;transition:transform .6s var(--ease),opacity .5s}.garden-btn:hover svg{transform:scale(1.06)}.garden-btn:not(.bloomed) svg .petal{opacity:0;transform:scale(.3);transform-origin:center;transition:all .6s}.garden-btn.bloomed svg .petal{opacity:1;transform:scale(1)}.garden-btn small{position:absolute;bottom:-18px;color:var(--rose-text);font-size:11px}
  .flower-options,.wrapping-options,.toppings{margin-top:22px;display:flex;flex-wrap:wrap;gap:9px}.choice{padding:11px 15px;border:1px solid rgba(81,70,76,.25);background:transparent;color:var(--ink);font-size:12px;transition:background .2s,transform .2s}.choice:hover{background:#fff}.choice.chosen{background:var(--rose-soft);border-color:var(--rose);transform:translateY(-2px)}.choice:disabled{opacity:.6}
  .svg-note{filter:drop-shadow(0 18px 23px rgba(103,71,77,.07))}.letter-finale{padding:30px 35px;background:rgba(255,254,251,.82);border:1px solid rgba(122,99,105,.22);box-shadow:0 28px 80px rgba(109,85,92,.1);transform:rotate(-2deg);max-width:540px;margin:auto}.letter-finale .signature{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:23px;color:var(--rose-text);text-align:right}.letter-finale p{font-size:15px;line-height:1.9;color:var(--ink);text-wrap:pretty}.letter-finale h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:48px;font-weight:400;margin:0 0 10px}
  .footer{position:fixed;bottom:17px;left:0;right:0;text-align:center;pointer-events:none;color:#766D74;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.02em}
  .corner-rose{position:fixed;width:145px;height:145px;pointer-events:none;z-index:-1;opacity:.44}.corner-rose.tl{left:-45px;top:105px;transform:rotate(-22deg)}.corner-rose.br{right:-32px;bottom:-33px;transform:rotate(151deg)}
  @media(max-width:980px){.scene,.scene.flip{grid-template-columns:1fr;gap:10px;min-height:unset;padding-bottom:35px}.scene.flip .copy-side{order:1}.scene.flip .art-side{order:2}.copy-side{justify-self:start;max-width:670px}.art-side{min-height:380px}.art-side svg{max-height:450px}h1{font-size:clamp(59px,8.8vw,88px)}.site-header{height:80px}main{padding-top:35px;align-items:flex-start}.garden{height:400px}.footer{position:relative;margin:4px auto 20px}}
  @media(max-width:600px){.site-header{height:75px;padding:12px 18px}.mark{font-size:23px}.mark small{font-size:8px;letter-spacing:.10em}.counter{font-size:11px}.restart{font-size:10px}.header-right{gap:10px}.progress{left:18px;right:18px}main{padding:35px 20px 16px;min-height:calc(100svh - 75px)}.scene{gap:16px}.chapter{margin-bottom:21px;font-size:9px}h1{font-size:clamp(54px,13.7vw,76px);line-height:.90;max-width:12em}.sub{margin-top:17px;font-size:13px;line-height:1.7;min-height:auto}.actions{margin-top:21px;gap:12px}.main-btn{min-height:48px;padding:12px 18px}.art-side{min-height:300px}.art-side svg{max-height:360px}.postcards{padding:5px;gap:8px}.postcard{box-shadow:0 8px 25px rgba(96,69,75,.07)}.postcard span{font-size:19px}.garden{height:290px;padding-bottom:48px}.garden:after{bottom:40px}.garden-btn svg{max-height:240px}.art-caption{font-size:13px}.flower-options,.wrapping-options,.toppings{gap:7px;margin-top:18px}.choice{padding:9px 11px;font-size:11px}.letter-finale{padding:20px 23px}.letter-finale h2{font-size:39px}.letter-finale p{font-size:14px}.footer{margin:10px auto 22px}.hint{font-size:10px}.corner-rose{display:none}}
  /* Finale: move caption into normal flow, below the rotated letter */
  .art-side:has(.letter-finale){overflow:visible}
  .art-side:has(.letter-finale)> .art-caption{position:relative;inset:auto;display:block;width:max-content;max-width:calc(100% - 24px);margin:20px 12px 0 auto;padding:3px 7px;color:#766D74;background:#FBF7F2;border-radius:2px;text-align:right;line-height:1.25}

  </style>
</head>
<body>
<header class="site-header">
  <a class="mark" href="#" id="markHome" aria-label="Bó Hoa Đến Trễ, về đầu">bó hoa đến trễ<small>một chuyện nhỏ gửi Thanh Nhã</small></a>
  <div class="header-right"><div class="counter"><strong id="progressText">01</strong> / 12</div><button class="restart" type="button" data-action="restart">Bắt đầu lại</button></div>
  <div class="progress" aria-hidden="true"><div class="progress-inner" id="progressInner"></div></div>
</header>
<svg aria-hidden="true" class="corner-rose tl" viewBox="0 0 200 200"><path d="M 98 188 Q 102 115 84 57 M 88 115 Q 42 97 24 106 M 100 145 Q 151 126 176 104" fill="none" stroke="#a18492" stroke-width="1.4"/><g fill="none" stroke="#a18492" stroke-width="1.5"><path d="M 86 64 C 43 45 55 6 88 20 C 105 4 131 33 109 55 C 121 68 107 90 86 64 Z"/></g></svg>
<svg aria-hidden="true" class="corner-rose br" viewBox="0 0 200 200"><path d="M 98 188 Q 102 115 84 57 M 88 115 Q 42 97 24 106 M 100 145 Q 151 126 176 104" fill="none" stroke="#a18492" stroke-width="1.4"/><g fill="none" stroke="#a18492" stroke-width="1.5"><path d="M 86 64 C 43 45 55 6 88 20 C 105 4 131 33 109 55 C 121 68 107 90 86 64 Z"/></g></svg>
<main><div id="app" aria-live="polite" aria-atomic="true"></div></main>
<div class="footer" aria-hidden="true">Made with a little courage & a lot of flowers.</div>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const defaultState = () => ({scene:0, opened:false, seal:false, cards:[], map:false, buds:[], flowers:[], paper:null, tied:false, note:false, cake:false, toppings:[], candle:'off', confession:false, response:null});
  let state = defaultState();
  try {const saved=sessionStorage.getItem('thanhNhaStoryV2'); if(saved){const parsed=JSON.parse(saved); if(parsed && Number.isInteger(parsed.scene) && parsed.scene>=0 && parsed.scene<=11) state={...defaultState(),...parsed};}}catch(e){}
  const save=()=>{try{sessionStorage.setItem('thanhNhaStoryV2',JSON.stringify(state));}catch(e){}};
  const safe = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const line='#8f7882';
  const svg=(content,view='0 0 700 510')=>`<svg viewBox="${view}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;
  const petal=(x,y,size=1,color='#EFC6D5',seed=0)=>{
    let petals=''; for(let i=0;i<6;i++){const angle=i*60+seed; petals+=`<ellipse cx="${x}" cy="${y-19*size}" rx="${11*size}" ry="${25*size}" transform="rotate(${angle} ${x} ${y})" fill="${color}" fill-opacity=".26" stroke="${line}" stroke-width="1.35"/>`}
    return `<g class="petal">${petals}<circle cx="${x}" cy="${y}" r="${5*size}" fill="#ECD69E" fill-opacity=".55" stroke="${line}" stroke-width="1"/><circle cx="${x}" cy="${y}" r="${2.3*size}" fill="${line}"/></g>`;
  };
  const leaf=(x,y,dir=1,s=1)=>`<path d="M ${x} ${y} q ${dir*22*s} ${-35*s} ${dir*46*s} ${-30*s} q ${dir*(-6)*s} ${30*s} ${-dir*46*s} ${30*s} Z" fill="#D8E4D9" fill-opacity=".65" stroke="${line}" stroke-width="1.1"/><path d="M ${x} ${y} q ${dir*21*s} ${-17*s} ${dir*46*s} ${-30*s}" fill="none" stroke="${line}" stroke-width=".9"/>`;
  const flower = (x,y,s=1,color='#EFC6D5',bud=false,variant=0) => `<g><path d="M ${x} 438 Q ${x-18*s} ${y+70*s} ${x} ${y}" fill="none" stroke="${line}" stroke-width="1.7" stroke-linecap="round"/>${leaf(x-9*s,y+95*s,-1,.9*s)}${leaf(x+2*s,y+146*s,1,.8*s)}${bud?`<path d="M ${x-17*s} ${y+5*s} Q ${x-22*s} ${y-27*s} ${x} ${y-39*s} Q ${x+22*s} ${y-27*s} ${x+17*s} ${y+5*s} Q ${x} ${y+20*s} ${x-17*s} ${y+5*s} Z" fill="#E9D8DF" stroke="${line}" stroke-width="1.3"/>`:petal(x,y,1.0*s,color,variant*9)}</g>`;
  const stemCluster=(small=false)=>{const chosen=state.flowers.length?state.flowers:['Hồng','Cúc','Tulip'];const palette=['#EABCCB','#F0DDBB','#D3DCEB','#E2C6CE','#E7D5BD'];let items=''; chosen.forEach((f,i)=>{const x=310+((i%3)-1)*82+(i>2?32:0), y=150+((i%2)*57);items+=flower(x,y,small?.53:.80,palette[i%palette.length],false,i)});return items;};
  const envelope=(isOpen=false)=>svg(`<g transform="translate(85 40)"><path d="M 62 160 L 420 160 L 420 365 L 62 365 Z" fill="#fffefd" stroke="${line}" stroke-width="2"/><path d="M 64 164 L 240 301 L 418 164" fill="none" stroke="${line}" stroke-width="1.5"/>${isOpen?`<path d="M 63 160 L 240 22 L 420 160" fill="#F9EDF0" stroke="${line}" stroke-width="1.7"/><path d="M 120 136 L 360 136 L 360 274 L 120 274 Z" fill="#fffdfa" stroke="${line}" stroke-width="1"/><text x="240" y="204" text-anchor="middle" font-size="31" font-family="Georgia" fill="#94576B" font-style="italic">Dear Nhã,</text>`:`<path d="M 62 363 L 240 224 L 420 363" fill="#f7f1ed" stroke="${line}" stroke-width="1.5"/><path d="M 62 160 L 240 295 L 420 160" fill="none" stroke="${line}" stroke-width="1.5"/><circle cx="240" cy="295" r="25" fill="#D9ABB8" stroke="${line}" stroke-width="1"/><path d="M 229 297 q 11 -20 22 0 q -11 12 -22 0" fill="none" stroke="#fff3ef" stroke-width="1.4"/>`}</g><g transform="translate(490 90) rotate(24)">${flower(40,65,.55,'#EBCAD5')}</g>`);
  const sealedLetter=()=>svg(`<g transform="translate(110 14) rotate(-6 230 235)"><rect x="70" y="45" width="370" height="410" fill="#fffefa" stroke="${line}" stroke-width="1.5"/><path d="M 98 90 H 410 M 98 108 H 410" fill="none" stroke="#D1C4C6" stroke-width=".8"/><text x="250" y="182" text-anchor="middle" fill="#94576B" font-family="Georgia" font-style="italic" font-size="30">For Thanh Nhã</text><path d="M 98 210 Q 235 230 395 205" fill="none" stroke="#d8c3c9" stroke-width="1"/><circle cx="255" cy="297" r="58" fill="${state.seal?'#f0e6e4':'#CF99AA'}" fill-opacity=".9" stroke="#a47888" stroke-width="2"/>${state.seal?`<path d="M 218 294 Q 252 246 283 294 Q 250 341 218 294" fill="none" stroke="#a47888" stroke-width="2"/>`:`<text x="255" y="307" text-anchor="middle" fill="#fffefa" font-family="Georgia" font-style="italic" font-size="38">N</text>`}<path d="M 108 396 H 397" stroke="#D1C4C6" stroke-width="1"/></g>`);
  const postcardPic=which=>svg(which==='flower'?flower(350,196,1.23,'#EFC3D1'):`<g stroke="${line}" fill="none"><path d="M 200 310 Q 350 390 500 310 M 235 310 L 255 210 L 450 210 L 475 310 Z" fill="#FFF6F2"/><path d="M 255 210 Q 350 195 450 210 M 283 208 Q 275 159 315 156 Q 334 119 360 153 Q 398 128 409 166 Q 449 162 425 211"/><path d="M 345 144 v-55 M 343 90 Q 336 76 344 65 Q 355 79 343 90" stroke="#c18891"/><path d="M 285 263 H 430"/></g>`);
  const mapArt=()=>svg(`<g transform="translate(80 45) rotate(-5 280 220)"><rect x="20" y="10" width="520" height="410" fill="#fffefa" stroke="${line}" stroke-width="1.5"/><path d="M 180 10 L 180 420 M 365 10 L 365 420" stroke="#C9BABF" stroke-width="1" stroke-dasharray="8 8"/><path d="M 65 350 C 120 260 165 375 206 270 S 312 115 375 198 S 432 330 498 68" stroke="#B98799" stroke-width="2.3" stroke-dasharray="4 13" stroke-linecap="round" fill="none"/><circle cx="65" cy="350" r="8" fill="#D6B0BA"/><text x="65" y="385" text-anchor="middle" font-family="Georgia" font-size="17" fill="#756B72" font-style="italic">start</text><circle cx="499" cy="68" r="14" fill="#D2E2D2" stroke="${line}" stroke-width="1"/><path d="M 493 68 l5 5 l10 -14" fill="none" stroke="${line}" stroke-width="2"/>${flower(285,170,.35,'#E8BBC9')}</g>`);
  const gardenArt=()=>`<div class="garden">${[0,1,2].map((i)=>`<button type="button" class="garden-btn ${state.buds.includes(i)?'bloomed':''}" data-action="bud" data-id="${i}" aria-label="Làm nở bông hoa ${i+1}">${svg(flower(350,170+i*18,.9,['#EEC7D0','#D4E3D5','#E5D7C1'][i],!state.buds.includes(i),i))}<small>${state.buds.includes(i)?'đã nở ♡':'chạm để nở'}</small></button>`).join('')}</div>`;
  const bouquetArt=(wrapped=false)=>svg(`<g transform="translate(7 -10)">${stemCluster()}${wrapped?`<path d="M 195 255 L 457 255 L 362 479 L 309 479 Z" fill="${state.paper==='sage'?'#DEE8DD':state.paper==='lavender'?'#E7E0EF':'#F3DDE4'}" fill-opacity=".85" stroke="${line}" stroke-width="1.5"/><path d="M 193 257 L 318 335 L 455 257 M 315 335 L 315 476" fill="none" stroke="${line}" stroke-width="1.2"/>${state.tied?`<path d="M 328 389 C 255 351 257 421 328 391 C 393 353 399 420 328 391 M 329 391 Q 298 427 275 438 M 330 392 Q 353 426 376 437" fill="#e3b2bf" fill-opacity=".35" stroke="#B97C91" stroke-width="2.8"/>`:''}`:''}</g>`);
  const noteArt=()=>svg(`<g transform="translate(70 65)">${stemCluster(true)}<path d="M 180 230 L 470 250 L 365 430 L 270 427 Z" fill="#f3dfe3" stroke="${line}" stroke-width="1.5"/><g transform="rotate(${state.note?'-4 330 250':'8 330 250'})"><rect x="218" y="${state.note?88:190}" width="255" height="170" rx="1" fill="#fffefa" stroke="${line}" stroke-width="1.3"/><text x="344" y="${state.note?158:255}" text-anchor="middle" font-family="Georgia" font-size="23" fill="#94576B" font-style="italic">${state.note?'Nhã ơi,': 'pull me ♡'}</text>${state.note?`<text x="344" y="203" text-anchor="middle" font-family="Georgia" font-size="13" fill="#6E656C">đáng yêu dữ vậy?</text>`:''}</g></g>`);
  const cakeArt=(dome=false)=>svg(`<g transform="translate(10 24)"><ellipse cx="345" cy="420" rx="255" ry="42" fill="#f2e5dd" fill-opacity=".35" stroke="${line}" stroke-width="1.2"/><path d="M 150 401 Q 350 448 547 401 L 537 420 Q 345 457 160 420 Z" fill="#F5E9DA" stroke="${line}" stroke-width="1.4"/><path d="M 202 247 Q 348 206 490 247 L 480 388 Q 352 425 215 390 Z" fill="#FFF4EE" stroke="${line}" stroke-width="1.6"/><ellipse cx="347" cy="249" rx="144" ry="43" fill="#fffdfa" stroke="${line}" stroke-width="1.5"/><path d="M 208 278 Q 240 304 258 275 Q 276 313 300 283 Q 328 316 349 284 Q 375 319 397 285 Q 431 308 454 278 Q 470 293 485 275" fill="none" stroke="#D6ABB6" stroke-width="2"/><path d="M 217 350 Q 354 397 481 350" fill="none" stroke="#D7B1BA" stroke-width="1.8"/>${state.toppings.map((t,i)=>`<g transform="translate(${i===0?-50:55} ${i===0?-5:4})">${t==='Dâu'?`<path d="M 347 215 Q 321 191 337 178 Q 353 181 354 197 Q 360 174 374 183 Q 383 201 347 215" fill="#DB9AA9" stroke="${line}" stroke-width="1.2"/>`:t==='Hoa kem'?petal(352,213,.46,'#DAB4C8'):`<path d="M 339 195 Q 346 181 353 196 Q 362 181 373 197 Q 364 210 354 218 Z" fill="#F2C9D2" stroke="${line}" stroke-width="1.2"/>`}</g>`).join('')}${state.candle!=='off'?`<path d="M 344 214 V 143 M 355 214 V 143" stroke="#B38B9D" stroke-width="1.6"/><path d="M 344 143 H 355" stroke="#B38B9D" stroke-width="1.6"/>${state.candle==='lit'?`<path d="M 350 136 Q 334 110 351 95 Q 370 115 350 136" fill="#EFCD7F" fill-opacity=".8" stroke="#B98C84" stroke-width="1.2"/>`:`<path d="M 352 133 q 12 -10 3 -22" fill="none" stroke="#B9AFAD" stroke-width="1.4"/>`}`:''}${dome?`<path d="M 150 401 C 120 176 165 68 348 60 C 535 70 577 191 547 401" fill="#fff" fill-opacity=".10" stroke="#9c858c" stroke-width="1.6"/><path d="M 323 61 Q 338 35 350 62" fill="none" stroke="#9c858c" stroke-width="1.6"/>`:''}</g>`);
  const finalLetterArt=()=>state.confession?`<div class="letter-finale"><p style="font-size:11px;color:#756B72;margin:0 0 13px;letter-spacing:.16em;text-transform:uppercase">Gửi riêng Thanh Nhã</p><h2>Nhã ơi,</h2><p>Anh thương em. Anh muốn có thêm thật nhiều ngày được ở cạnh em — và anh vẫn nợ em một bó hoa với chiếc bánh thật nữa.</p><p>Em cho anh một cơ hội được thương em nha?</p><div class="signature">từ anh ♡</div></div>`:svg(`<g transform="translate(85 45) rotate(-4 310 230)"><rect x="80" y="28" width="390" height="410" fill="#fffefa" stroke="${line}" stroke-width="1.5"/><path d="M 110 85 H 445 M 110 95 H 445" stroke="#dbced2"/><text x="280" y="218" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#94576B">To my Nhã,</text><path d="M 240 271 Q 269 238 289 268 Q 317 240 333 268 Q 320 297 289 316 Q 256 290 240 271" fill="#edc6d2" fill-opacity=".35" stroke="#B78797" stroke-width="1.5"/><text x="280" y="390" text-anchor="middle" font-family="Georgia" font-size="16" font-style="italic" fill="#756B72">tap to unfold</text></g>`);
  const btn=(action,label,kind='',attrs='')=>`<button class="main-btn ${kind}" type="button" data-action="${action}" ${attrs}>${label}</button>`;
  const next=(label='Tiếp một chút nha')=>btn('next',`${label} <span aria-hidden="true">↗</span>`);
  const back=()=>state.scene>0?`<button type="button" class="text-btn" data-action="back">← Quay lại</button>`:'';
  const stages=[
    {chapter:'I / Lá thư',title:'Nhã ơi,<br><em>có thư nè.</em>',sub:'Một phong thư hơi đi đường vòng. May mà cuối cùng cũng tới đúng người.',render:()=>envelope(state.opened),actions:()=>state.opened?next('Đọc tiếp đi em'):btn('open','Mở phong thư ♡')},
    {chapter:'I / Lá thư',title:'Bóc tem<br><em>giúp anh nha.</em>',sub:'Nhã bóc nhẹ thôi. Có người gửi thư mà hồi hộp hơn cả người nhận.',render:sealedLetter,actions:()=>state.seal?next('Xem có gì bên trong'):btn('seal','Chạm con dấu N')},
    {chapter:'I / Lá thư',title:'Anh nhớ<br><em>hai món này.</em>',sub:'Anh từng hứa một bó hoa và một chiếc bánh. Lật cả hai bưu thiếp để xem nha.',render:()=>`<div class="postcards">${['flower','cake'].map((key,i)=>`<button type="button" class="postcard ${state.cards.includes(key)?'revealed':''}" data-action="card" data-id="${key}" aria-pressed="${state.cards.includes(key)}">${postcardPic(key)}<span>${state.cards.includes(key)?(key==='flower'?'Bó hoa 🌷':'Bánh kem ♡'):'Lật bưu thiếp'}</span></button>`).join('')}</div>`,actions:()=>state.cards.length===2?next('Mình đi tìm quà nha'):''},
    {chapter:'I / Lá thư',title:'Hình như quà<br><em>đi lạc rồi.</em>',sub:'Anh vẽ bản đồ có hơi… trừu tượng. May là điểm đến thì anh nhớ.',render:mapArt,actions:()=>next('Theo dấu hoa')},
    {chapter:'II / Vườn hoa',title:'Nhã đánh thức<br><em>vườn hoa nha.</em>',sub:'Ba bông hoa đang ngủ. Chạm nhẹ từng bông để gọi các bạn ấy dậy.',render:gardenArt,actions:()=>state.buds.length===3?next('Chọn hoa nào'):''},
    {chapter:'II / Vườn hoa',title:'Bó hoa này<br><em>để Nhã chọn.</em>',sub:'Chọn ít nhất ba loại hoa mà em thích. Anh chỉ việc đứng đây khen gu của em thôi.',render:()=>bouquetArt(false),actions:()=>`${state.flowers.length>=3?next('Gói hoa cho em'):''}${back()}`,extra:()=>`<div class="flower-options">${['Hồng','Cúc','Tulip','Mẫu đơn','Baby'].map(f=>`<button class="choice ${state.flowers.includes(f)?'chosen':''}" data-action="flower" data-id="${f}" type="button" aria-pressed="${state.flowers.includes(f)}">${safe(f)} ${state.flowers.includes(f)?'✓':'+'}</button>`).join('')}</div>`,status:()=>`${state.flowers.length}/3 bông tối thiểu`},
    {chapter:'II / Vườn hoa',title:'Gói lại<br><em>một chút thương.</em>',sub:'Nhã chọn màu giấy, anh phụ buộc nơ. Hợp tác quá chuyên nghiệp luôn.',render:()=>bouquetArt(true),actions:()=>state.tied?next('Xem còn gì giấu nữa'):btn('tie','Buộc một chiếc nơ', '',state.paper?'':'disabled'),extra:()=>`<div class="wrapping-options">${[['pink','Hồng phấn'],['sage','Xanh lá'],['lavender','Tím nhạt']].map(([id,name])=>`<button class="choice ${state.paper===id?'chosen':''}" type="button" data-action="paper" data-id="${id}" aria-pressed="${state.paper===id}">${name}</button>`).join('')}</div>`},
    {chapter:'II / Vườn hoa',title:'Ủa…<br><em>có tờ giấy!</em>',sub:'Trong bó hoa có gì nhỏ nhỏ. Nhã kéo ra đọc thử nè.',render:noteArt,actions:()=>state.note?next('Ghé qua tiệm bánh'):btn('note','Kéo tấm thiệp ra ♡'),message:()=>state.note?'Hoa online không cần tưới. Nhưng người tặng thì đang hồi hộp thật.':''},
    {chapter:'III / Chiếc bánh',title:'Tiệm bánh<br><em>của riêng Nhã.</em>',sub:'Hôm nay tiệm mở muộn một chút, nhưng để dành chiếc bánh dễ thương nhất.',render:()=>cakeArt(!state.cake),actions:()=>state.cake?next('Trang trí bánh thôi'):btn('cloche','Nhấc chuông kính lên')},
    {chapter:'III / Chiếc bánh',title:'Đầu bếp Nhã<br><em>lên ca rồi!</em>',sub:'Chọn hai món trang trí cho chiếc bánh. Anh không tranh dâu đâu, hứa đó.',render:()=>cakeArt(false),extra:()=>`<div class="toppings">${['Dâu','Hoa kem','Trái tim'].map(f=>`<button class="choice ${state.toppings.includes(f)?'chosen':''}" type="button" data-action="topping" data-id="${f}" aria-pressed="${state.toppings.includes(f)}">${safe(f)} ${state.toppings.includes(f)?'✓':'+'}</button>`).join('')}</div>`,actions:()=>state.toppings.length>=2?next('Đến lúc ước rồi'):''},
    {chapter:'III / Chiếc bánh',title:'Ước một điều<br><em>đi em.</em>',sub:'Anh không nhìn trộm điều ước đâu. Anh chỉ thắp nến giúp thôi.',render:()=>cakeArt(false),actions:()=>state.candle==='blown'?next('Mở bí mật cuối cùng'):state.candle==='lit'?btn('blow','Thổi nến ♡'):btn('light','Thắp nến lên')},
    {chapter:'III / Điều cuối',title:'Điều anh<br><em>muốn nói.</em>',sub:state.response?'Một câu trả lời đáng quý, dù thế nào cũng vậy.':'Lá thư cuối cùng chỉ có vài dòng thôi. Nhưng là điều anh thật sự muốn nói.',render:finalLetterArt,actions:()=>state.response?btn('restart','Xem lại từ đầu','secondary'):state.confession?`${btn('yes','Dạaa 🌷')}${btn('think','Để em nghĩ thêm 🥹','secondary')}`:btn('confess','Mở lá thư cuối cùng'),message:()=>state.response==='yes'?'Anh còn nợ Nhã một buổi có hoa và bánh thật đó nha. ♡':state.response==='think'?'Anh hiểu mà. Nhã cứ thong thả nha. ♡':''}
  ];
  function render(){
    state.scene=Math.max(0,Math.min(11,state.scene));
    const stage=stages[state.scene];
    document.getElementById('progressText').textContent=String(state.scene+1).padStart(2,'0');
    document.getElementById('progressInner').style.width=((state.scene+1)/12*100)+'%';
    let actionContent=stage.actions?.()||'';
    if(state.scene!==5 && state.scene!==11) actionContent += back();
    app.innerHTML=`<section class="scene ${[2,5,7,9].includes(state.scene)?'flip':''}" aria-labelledby="sceneTitle"><div class="copy-side"><p class="chapter"><span aria-hidden="true"></span>${stage.chapter} · ${String(state.scene+1).padStart(2,'0')}/12</p><h1 id="sceneTitle" tabindex="-1">${stage.title}</h1><p class="sub">${safe(stage.sub)}</p>${stage.extra?.()||''}${stage.message?.()?`<div class="message">${safe(stage.message())}</div>`:''}<div class="mini-status" aria-live="polite">${state.scene===4?`${state.buds.length}/3 bông đã nở`:state.scene===5?`${state.flowers.length}/3 bông tối thiểu`:state.scene===9?`${state.toppings.length}/2 topping đã chọn`:''}</div><div class="actions">${actionContent}</div><p class="hint">${state.scene===11?'Không có câu trả lời nào bị gửi đi. Nhã cứ chọn điều em thật sự muốn.':'Nhấn để khám phá. Có thể quay lại bất cứ lúc nào.'}</p></div><div class="art-side">${stage.render()}<div class="art-caption">a little something, only for Nhã</div></div></section>`;
    save();
  }
  app.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]'); if(!b || b.disabled) return;
    const a=b.dataset.action, id=b.dataset.id;
    switch(a){
      case 'next': state.scene=Math.min(11,state.scene+1);break;
      case 'back': state.scene=Math.max(0,state.scene-1);break;
      case 'restart': state=defaultState();break;
      case 'open': state.opened=true;break;
      case 'seal': state.seal=true;break;
      case 'card': if(!state.cards.includes(id)) state.cards.push(id);break;
      case 'bud': {const n=Number(id); if(!state.buds.includes(n)) state.buds.push(n);break;}
      case 'flower': if(state.flowers.includes(id))state.flowers=state.flowers.filter(x=>x!==id);else state.flowers.push(id);break;
      case 'paper':state.paper=id;state.tied=false;break;
      case 'tie':if(state.paper)state.tied=true;break;
      case 'note':state.note=true;break;
      case 'cloche':state.cake=true;break;
      case 'topping': if(state.toppings.includes(id))state.toppings=state.toppings.filter(x=>x!==id);else if(state.toppings.length<2)state.toppings.push(id);break;
      case 'light':state.candle='lit';break;
      case 'blow':state.candle='blown';break;
      case 'confess':state.confession=true;break;
      case 'yes':state.response='yes';break;
      case 'think':state.response='think';break;
    }
    render();
    if(['next','back','restart'].includes(a)){
      window.scrollTo({top:0,behavior:'instant'});
      document.getElementById('sceneTitle')?.focus({preventScroll:true});
    } else {
      const sameControl=[...app.querySelectorAll('[data-action]')].find(el=>el.dataset.action===a && el.dataset.id===id);
      (sameControl || app.querySelector('.actions [data-action]'))?.focus({preventScroll:true});
    }
  });
  document.querySelector('[data-action="restart"]').addEventListener('click',()=>{state=defaultState();render();});
  document.getElementById('markHome').addEventListener('click',e=>{e.preventDefault();state.scene=0;render();});
  render();
})();
</script>
</body>
</html>
